name: Co-op autonomous starter integration QA (isolated)

on:
  push:
    branches:
      - qa/cohesion-autonomous-starters-20261104

permissions:
  contents: read

jobs:
  independent-starters:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "recursive"
      - name: Install repository dependencies
        uses: ./.github/actions/setup-deps
      - name: Install Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test two-browser saved-Pokédex starter selection
        run: pnpm exec playwright test test/e2e/coop-autonomous-starters.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-cohesion-failure
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 2

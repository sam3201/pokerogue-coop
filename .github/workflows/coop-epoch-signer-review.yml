name: SAM co-op epoch signer review checks

on:
  push:
    branches:
      - review/coop-epoch-signer-isolation-20261031
    paths:
      - tools/coop-epoch-signer-review/**
      - .github/workflows/coop-epoch-signer-review.yml
  pull_request:
    paths:
      - tools/coop-epoch-signer-review/**
      - .github/workflows/coop-epoch-signer-review.yml

permissions:
  contents: read

jobs:
  signer-review:
    name: Focused signer and provisioning tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Run isolated signer security tests
        working-directory: tools/coop-epoch-signer-review
        run: |
          python -m unittest -q \
            test_private_owner_signer_service_v1.py \
            test_verify_signer_install_v1.py \
            test_staged_signer_isolated_entrypoint_v1.py \
            test_preflight_owner_isolation_v1.py
      - name: Verify reviewed code digests
        working-directory: tools/coop-epoch-signer-review
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d = Path('signer_install_review_v1/code')
          m = json.loads((d / 'signer-code-manifest.json').read_text())
          assert m['schema'] == 'sam.coop.signer-code-manifest.v1'
          assert len(m['files']) == 3
          for name, digest in m['files'].items():
              assert hashlib.sha256((d / name).read_bytes()).hexdigest() == digest, name
          print('STAGED_MANIFEST_OK')
          PY

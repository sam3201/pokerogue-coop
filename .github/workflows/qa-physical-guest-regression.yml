name: Physical guest input and sequencer regression (isolated)

on:
  push:
    branches:
      - qa/cohesion-physical-guest-20261107b

permissions:
  contents: read

jobs:
  physical-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact integrated source with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Install Chromium and system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify guest keyboard confirmation and sequenced command receipt
        run: pnpm exec playwright test test/e2e/coop-sam-guest-turn.spec.ts --project=chromium --workers=1 --reporter=line --retries=0
      - name: Retain failure evidence only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: physical-guest-cohesion-failure
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 2

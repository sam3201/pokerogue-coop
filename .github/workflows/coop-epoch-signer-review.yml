name: SAM co-op epoch signer review checks

on:
  push:
    branches:
      - review/coop-epoch-signer-isolation-20261031
    paths:
      - tools/coop-epoch-signer-review/**
      - .github/workflows/coop-epoch-signer-review.yml
  pull_request:
    paths:
      - tools/coop-epoch-signer-review/**
      - .github/workflows/coop-epoch-signer-review.yml

permissions:
  contents: read

jobs:
  signer-review:
    name: Focused signer and provisioning tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<47'
      - name: Run isolated signer security tests
        working-directory: tools/coop-epoch-signer-review
        run: |
          python -m unittest -q \
            test_private_owner_signer_service_v1.py \
            test_verify_signer_install_v1.py \
            test_staged_signer_isolated_entrypoint_v1.py \
            test_preflight_owner_isolation_v1.py
      - name: Test isolated relay gateway and eleven-gate preflight
        working-directory: tools/coop-epoch-signer-review
        run: python -m unittest -q test_private_relay_peer_gateway_v1.py
      - name: Test capture-owner enrollment and relay broker in Node
        working-directory: tools/coop-epoch-signer-review
        run: |
          node --check capture_owner_room_enrollment_v1.mjs
          node --check owner_room_grant_broker_v1.mjs
          node --check owner_room_grant_ipc_v1.mjs
          node --test test_capture_owner_room_enrollment_v1.mjs
      - name: Run isolated Node and Python relay gateway fixture
        working-directory: tools/coop-epoch-signer-review
        run: node run_real_disposable_peer_gateway_v1.mjs
      - name: Prove distinct Unix UID signer isolation (disposable CI only)
        working-directory: tools/coop-epoch-signer-review
        run: sudo -n "$(command -v python)" -I test_distinct_uid_signer_integration_v1.py
      - name: Check owner-gated relay patch compatibility without applying
        run: git apply --check tools/coop-epoch-signer-review/RELAY_OWNER_SIGNED_ROOM_GRANT_V3.patch
      - name: Verify reviewed code digests
        working-directory: tools/coop-epoch-signer-review
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d = Path('signer_install_review_v1/code')
          m = json.loads((d / 'signer-code-manifest.json').read_text())
          assert m['schema'] == 'sam.coop.signer-code-manifest.v1'
          assert len(m['files']) == 3
          for name, digest in m['files'].items():
              assert hashlib.sha256((d / name).read_bytes()).hexdigest() == digest, name
          print('STAGED_MANIFEST_OK')
          PY

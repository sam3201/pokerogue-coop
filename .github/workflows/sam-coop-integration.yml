name: SAM co-op integration (isolated)
on:
  push:
    branches:
      - feature/sam-autonomous-coop-20261103
  pull_request:
    branches:
      - coop
    paths:
      - "test/e2e/pokerogue-*.mjs"
      - "test/e2e/test-pokerogue-*.mjs"
      - "test/e2e/coop-autonomous-starters.spec.ts"
      - "test/e2e/coop-autonomous-battle-fps.spec.ts"
      - "test/e2e/coop-autonomous-full-wave.spec.ts"
      - "src/coop/text-catchup.ts"
      - "src/ui/handlers/message-ui-handler.ts"
      - "test/e2e/coop-capture-restart.spec.ts"
      - ".github/workflows/sam-coop-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-coop-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-policy-contracts:
    name: Local co-op policy and save contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check module parsing
        run: |
          node --check test/e2e/pokerogue-starter-policy.mjs
          node --check test/e2e/pokerogue-starter-browser.mjs
          node --check test/e2e/pokerogue-seat-state.mjs
          node --check test/e2e/pokerogue-capture-policy.mjs
      - name: Verify starter, capture and save contracts
        run: |
          node --test \
            test/e2e/test-pokerogue-starter-policy.mjs \
            test/e2e/test-pokerogue-capture-policy.mjs \
            test/e2e/test-pokerogue-seat-state.mjs \
            test/e2e/test-pokerogue-starter-browser.mjs \
            test/e2e/test-pokerogue-module-integrity.mjs \
            test/e2e/test-pokerogue-text-catchup.mjs
      # Browser E2E is intentionally separate: it requires real local game
      # accounts/saves and a running relay. Do not pass synthetic unlocks here.


  clean-checkout-starter-e2e:
    name: Fresh checkout two-browser starter E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COOP_E2E: "1"
      CI: "true"
    steps:
      - name: Checkout the actual game source and immutable assets
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          submodules: recursive
      - name: Install exact project dependencies
        uses: ./.github/actions/setup-deps
      - name: Install Chromium and its system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser starter selection from a clean checkout
        run: |
          pnpm exec playwright test \
            test/e2e/coop-autonomous-starters.spec.ts \
            test/e2e/coop-autonomous-battle-fps.spec.ts \
            --project=chromium --workers=1 --reporter=line
      - name: Validate real game-generated first-wave reward
        timeout-minutes: 15
        env:
          COOP_FULL_WAVE_E2E: "1"
        run: |
          pnpm exec playwright test \
            test/e2e/coop-autonomous-full-wave.spec.ts \
            --project=chromium --workers=1 --reporter=line --retries=0
      - name: Validate published full-wave evidence
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const p = "test-results/acceptance/full-wave-ci.json";
          const report = JSON.parse(fs.readFileSync(p, "utf8"));
          const valid = report.acceptance === "passed"
            && report.verifiedGameRewards === true
            && report.checkpointEquality === true
            && report.checkpointCount >= 3
            && report.hostDesync === null
            && report.guestDesync === null
            && report.hostAcceptedButtonSubmissions > 0
            && report.guestAcceptedButtonSubmissions > 0
            && report.hostedBrowserOnly === true
            && report.macGameplayFpsVerified === false
            && report.userSavesAccessed === false
            && report.gamePolicyTrainingPerformed === false
            && report.sourceCommit === process.env.GITHUB_SHA
            && report.workflowRunId === process.env.GITHUB_RUN_ID;
          if (!valid) {
            console.error("Full-wave acceptance report is absent or inconsistent");
            process.exit(1);
          }
          console.log("SAM_COOP_FULL_WAVE_ARTIFACT_OK", report.checkpointCount);
          NODE
      - name: Retain verified full-wave handoff
        uses: actions/upload-artifact@v4
        with:
          name: sam-coop-full-wave-acceptance
          path: test-results/acceptance/full-wave-ci.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sam-coop-starter-failure
          path: test-results/e2e/
          retention-days: 3
          if-no-files-found: ignore
